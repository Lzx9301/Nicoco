/* ── Tokens ──────────────────────────────────────────────────── */

<script>
// ══════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════
const STATUS_LABELS = {
  new:'新案件', contacted:'已聯絡', meeting:'需求訪談',
  quoted:'已報價', developing:'開發中', done:'完成', cancelled:'取消',
};
const ACTIVITY_TYPE_LABELS = {
  contact:'聯絡紀錄', meeting:'需求訪談', quote:'報價紀錄',
  payment:'付款紀錄', development:'開發進度', note:'一般備註',
  change_request:'變更需求', agreement:'合約', acceptance:'驗收／保固', requirement:'需求審核',
};

// ══════════════════════════════════════════════════
//  AUTH GUARD
// ══════════════════════════════════════════════════
function guardAdmin(onPass) {
  auth.onAuthStateChanged(user => {
    if (!user) {
      window.location.replace(`admin-login.html?next=${encodeURIComponent(window.location.href)}`);
      return;
    }
    if (!ALLOWED_EMAILS.includes(user.email)) {
      auth.signOut(); window.location.replace('admin-login.html'); return;
    }
    document.getElementById('headerEmail').textContent = user.email;
    onPass();
  });
}
async function signOut() {
  await auth.signOut();
  window.location.replace('admin-login.html');
}

// ══════════════════════════════════════════════════
//  LOAD
// ══════════════════════════════════════════════════
async function loadDashboard() {
  try {
    const snap = await db.collection('quotes').orderBy('createdAt', 'desc').get();
    const all  = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    // Security v1：把客戶在公開報價上的接受／拒絕同步回內部案件（只檢查可能有新回覆的案件）
    await NicocoQuotation.reconcileAll(db, all);

    // 方案 A：對每筆案件平行讀取 paymentMilestones subcollection，暫存在 _paymentMilestones（純前端用途，不寫回 Firestore）。
    // 單一案件查詢失敗不應讓整個 Dashboard 白屏，fallback 成空陣列，讓其他案件正常顯示。
    await Promise.all(all.map(async q => {
      try {
        const pmSnap = await db.collection('quotes').doc(q.id).collection('paymentMilestones').get();
        q._paymentMilestones = pmSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (err) {
        console.error(`讀取案件 ${q.id} 的 paymentMilestones 失敗：`, err);
        q._paymentMilestones = [];
      }
    }));

    render(all);
  } catch (err) {
    document.getElementById('wrap').innerHTML =
      `<div class="loading-state" style="color:var(--red)">⚠ 讀取失敗：${escapeHtml(err.message || String(err))}</div>`;
  }
}

// ══════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════
function tsToMs(ts) {
  if (!ts) return 0;
  return ts.toMillis ? ts.toMillis() : new Date(ts).getTime();
}
function fmtMoney(n) { return `NT$${Number(n || 0).toLocaleString()}`; }
function fmtMoneyShort(n) {
  const v = Number(n || 0);
  if (v >= 1000000) return `NT$${(v/1000000).toFixed(1)}M`;
  if (v >= 1000)    return `NT$${(v/1000).toFixed(0)}K`;
  return fmtMoney(v);
}
function fmtDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('zh-TW', { month:'2-digit', day:'2-digit' });
}
function fmtDateFull(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit' });
}
function fmtDatetime(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('zh-TW', { month:'2-digit', day:'2-digit' }) +
    ' ' + d.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
}
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function isExpiredTs(ts) {
  if (!ts) return false;
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d < new Date();
}
// 取案件的「成交日期」：quotationUpdatedAt → updatedAt → createdAt
function wonMs(q) {
  return tsToMs(q.quotationUpdatedAt) || tsToMs(q.updatedAt) || tsToMs(q.createdAt);
}
// 取案件的「金額」：quotationTotal → officialPrice
function wonAmount(q) {
  return Number(q.quotationTotal || q.officialPrice || 0);
}

// ══════════════════════════════════════════════════
//  PAYMENT MILESTONE HELPERS（v1 Dashboard 整合，方案 A）
//  全部算法與 quote-detail.html 現有 Payment Milestone 邏輯一致；
//  不修改 wonAmount() / wonMs() / getMonthBounds() / tsToMs() / isExpiredTs()。
// ══════════════════════════════════════════════════

// 共用 local-date helper：用瀏覽器本地時區產生 YYYY-MM-DD，避免 UTC 判斷錯一天（與 quote-detail.html 一致）
function getLocalDateStr(d) {
  const date = d instanceof Date ? d : new Date();
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function hasPaymentMilestones(q) {
  return Array.isArray(q._paymentMilestones) && q._paymentMilestones.length > 0;
}
// 目前應收總額基準：優先用 project.currentContractValue（未來 Change Request 核准後才會出現），
// 沒有則 fallback project.contractAmount（原始合約金額快照），都沒有則 0。
function paymentContractAmount(q) {
  const proj = q.project;
  if (proj && Number(proj.currentContractValue) > 0) return Number(proj.currentContractValue);
  if (proj && Number(proj.contractAmount) > 0) return Number(proj.contractAmount);
  return 0;
}
function paymentPaidAmount(q) {
  return (q._paymentMilestones || [])
    .filter(p => p.status === 'paid')
    .reduce((s, p) => s + (Number(p.amount) || 0), 0);
}
// 應收剩餘永遠 >= 0，避免合約總額被下修（例如未來 Change Request 減項）後出現負數 Remaining
function paymentRemainingAmount(q) {
  return Math.max(paymentContractAmount(q) - paymentPaidAmount(q), 0);
}
// 溢收／待退款：已收金額超過目前合約總額的部分
function paymentOverpaidAmount(q) {
  return Math.max(paymentPaidAmount(q) - paymentContractAmount(q), 0);
}
// Σ status==='pending' 且 dueDate < 今天 的 amount（已付款的過期項目不算，見規則 十四-H）
function paymentOverdueAmount(q) {
  const todayStr = getLocalDateStr();
  return (q._paymentMilestones || [])
    .filter(p => p.status === 'pending' && p.dueDate && p.dueDate < todayStr)
    .reduce((s, p) => s + (Number(p.amount) || 0), 0);
}
// 尚未 paid 且有 dueDate 中日期最早的一筆
function paymentNextDue(q) {
  const list = (q._paymentMilestones || []).filter(p => p.status !== 'paid' && p.dueDate);
  if (!list.length) return null;
  return list.sort((a, b) => (a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0))[0];
}
// Σ status==='paid' 且 paidAt 落在本月 的 amount
function paymentRevenueThisMonth(q) {
  const { startMs, endMs } = getMonthBounds();
  return (q._paymentMilestones || [])
    .filter(p => p.status === 'paid' && p.paidAt)
    .filter(p => { const ms = tsToMs(p.paidAt); return ms >= startMs && ms <= endMs; })
    .reduce((s, p) => s + (Number(p.amount) || 0), 0);
}

// ══════════════════════════════════════════════════
//  CALCULATIONS
// ══════════════════════════════════════════════════
function getMonthBounds() {
  const now   = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  const end   = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
  return { startMs: start.getTime(), endMs: end.getTime() };
}

// 待收款金額：有 Payment Milestone 用 Remaining，沒有則沿用 wonAmount()（既有邏輯，未改動）
function pendingAmountFor(q) {
  return hasPaymentMilestones(q) ? paymentRemainingAmount(q) : wonAmount(q);
}

function calcStats(all) {
  const { startMs, endMs } = getMonthBounds();
  const now = new Date();

  // ── 整體 ──────────────────────────────────────
  let total = all.length, newCount = 0, developing = 0, done = 0;
  // ── 今日工作 ──────────────────────────────────
  let needContact = 0, waitingConfirm = 0, inDev = 0, waitingPayment = 0;
  // ── 本月 ──────────────────────────────────────
  let monthNew = 0, monthRevenue = 0, monthRevenueCount = 0;
  // ── KPI ───────────────────────────────────────
  let kpiRevenue = 0, kpiWon = 0;       // 本月成交
  let totalWon = 0, totalWonCount = 0;  // 全部成交（算平均客單）
  let hasQuotation = 0;                 // 有報價的案件（算成交率分母）
  let pendingPayment = 0;               // 待收款金額
  let pendingPaymentCount = 0;
  let pendingQuote = 0;                 // 待處理報價數（sent）
  // ── 報價狀態摘要 ──────────────────────────────
  let qDraft = 0, qSent = 0, qAccepted = 0, qRejected = 0, qNone = 0;
  // ── 逾期報價（quote 本身過期，與付款逾期是不同概念）──
  const overdueItems = [];
  // ── 待收款列表 ────────────────────────────────
  const pendingPayItems = [];
  // ── 付款逾期／最近到期款（僅來自有 Payment Milestone 的案件，milestone 層級的攤平清單）──
  let paymentOverdueTotal = 0;
  const paymentOverdueItems = [];
  const paymentUpcomingItems = [];
  const todayStr = getLocalDateStr();

  all.forEach(q => {
    const status  = q.status || 'new';
    const qStatus = q.quotationStatus || '';
    const amount  = wonAmount(q);
    const createdMs = tsToMs(q.createdAt);
    const hasPM = hasPaymentMilestones(q);

    // 整體計數
    if (status === 'new')        newCount++;
    if (status === 'developing') developing++;
    if (status === 'done')       done++;

    // 今日工作
    if (status === 'new' || status === 'contacted') needContact++;
    if (qStatus === 'sent')  waitingConfirm++;
    if (status === 'developing') inDev++;

    // 待收款：有 Payment Milestone 用 Remaining（>0 才算），沒有則沿用既有 accepted && paymentStatus!=='paid' 判斷
    if (hasPM) {
      const remaining = paymentRemainingAmount(q);
      if (remaining > 0) {
        waitingPayment++;
        pendingPayment += remaining; pendingPaymentCount++;
        pendingPayItems.push(q);
      }
    } else if (qStatus === 'accepted' && q.paymentStatus !== 'paid') {
      waitingPayment++;
      if (amount > 0) { pendingPayment += amount; pendingPaymentCount++; }
      pendingPayItems.push(q);
    }

    // 本月新案件
    if (createdMs >= startMs && createdMs <= endMs) monthNew++;

    // 成交判定
    const isWon = status === 'done' || qStatus === 'accepted';

    // 全部成交（平均客單）—— 維持既有邏輯，不因 Payment Milestone 改變合約總額的認列方式
    if (isWon && amount > 0) { totalWon += amount; totalWonCount++; }

    // 本月營收：有 Payment Milestone 用「本月實際已付款金額」；沒有則沿用既有「本月成交金額（wonMs）」
    if (hasPM) {
      const paidThisMonth = paymentRevenueThisMonth(q);
      if (paidThisMonth > 0) { kpiRevenue += paidThisMonth; kpiWon++; }
    } else {
      const wMs = wonMs(q);
      if (isWon && amount > 0 && wMs >= startMs && wMs <= endMs) {
        kpiRevenue += amount; kpiWon++;
      }
    }

    // 有報價的案件（成交率分母）
    const hasQ = (amount > 0) || ['sent','accepted','rejected'].includes(qStatus);
    if (hasQ) hasQuotation++;

    // 待處理報價
    if (qStatus === 'sent') pendingQuote++;

    // 報價狀態摘要
    if (!qStatus || qStatus === '')   qNone++;
    else if (qStatus === 'draft')     qDraft++;
    else if (qStatus === 'sent')      qSent++;
    else if (qStatus === 'accepted')  qAccepted++;
    else if (qStatus === 'rejected')  qRejected++;

    // 逾期報價：validUntil 已過 & status 是 sent 或 draft（既有邏輯，未改動）
    if (isExpiredTs(q.validUntil) && (qStatus === 'sent' || qStatus === 'draft')) {
      overdueItems.push(q);
    }

    // 付款逾期／最近到期款：攤平到 milestone 層級（同一案件多筆逾期就各自列出，最簡單也最不會漏資訊）
    if (hasPM) {
      (q._paymentMilestones || []).forEach(p => {
        if (p.status === 'pending' && p.dueDate && p.dueDate < todayStr) {
          paymentOverdueTotal += Number(p.amount) || 0;
          paymentOverdueItems.push({ q, milestone: p });
        }
        if (p.status !== 'paid' && p.dueDate) {
          paymentUpcomingItems.push({ q, milestone: p });
        }
      });
    }
  });

  const avgDeal     = totalWonCount > 0 ? Math.round(totalWon / totalWonCount) : 0;
  const closeRate   = hasQuotation > 0 ? Math.round((totalWonCount / hasQuotation) * 100) : 0;

  return {
    total, newCount, developing, done,
    needContact, waitingConfirm, inDev, waitingPayment, monthNew,
    kpiRevenue, kpiWon, avgDeal, closeRate,
    hasQuotation, totalWonCount,
    pendingPayment, pendingPaymentCount, pendingQuote,
    qDraft, qSent, qAccepted, qRejected, qNone,
    overdueItems:    overdueItems.sort((a,b) => tsToMs(a.validUntil) - tsToMs(b.validUntil)).slice(0,5),
    pendingPayItems: pendingPayItems.sort((a,b) => pendingAmountFor(b) - pendingAmountFor(a)).slice(0,5),
    paymentOverdueTotal,
    paymentOverdueItems:  paymentOverdueItems.sort((a,b) => a.milestone.dueDate < b.milestone.dueDate ? -1 : 1).slice(0,5),
    paymentUpcomingItems: paymentUpcomingItems.sort((a,b) => a.milestone.dueDate < b.milestone.dueDate ? -1 : 1).slice(0,5),
  };
}

function getActionItems(all) {
  return all.filter(q => q.status !== 'done' && q.status !== 'cancelled').slice(0, 5);
}
function collectTimeline(all) {
  const logs = [];
  all.forEach(q => {
    (q.activityLogs || []).forEach(log => {
      logs.push({ ...log, quoteId: q.quoteId || q.id, docId: q.id });
    });
  });
  logs.sort((a, b) => tsToMs(b.createdAt) - tsToMs(a.createdAt));
  return logs.slice(0, 10);
}

        ${s.pendingPaymentCount > 5
          ? `<div style="font-size:11px;color:var(--ink-30);margin-top:10px;text-align:center">顯示金額最高的 5 筆，共 ${s.pendingPaymentCount} 筆</div>`
          : ''}
      </div>

    </div>

    <!-- ③.5 付款追蹤（僅來自有 Payment Milestone 的案件）-->
    <div class="section-title">付款追蹤</div>
    <div class="two-col" style="gap:16px">

      <div class="card">
        <div class="card-title">
          付款逾期
          ${s.paymentOverdueTotal > 0 ? `<span style="font-size:11px;color:var(--red);font-weight:700;text-transform:none;letter-spacing:0">${fmtMoney(s.paymentOverdueTotal)}</span>` : ''}
        </div>
        ${s.paymentOverdueItems.length === 0
          ? '<div class="empty-row">✓ 無付款逾期</div>'
          : s.paymentOverdueItems.map(item => paymentOverdueRow(item)).join('')
        }
      </div>

      <div class="card">
        <div class="card-title">最近到期款</div>
        ${s.paymentUpcomingItems.length === 0
          ? '<div class="empty-row">✓ 目前沒有待追蹤的到期款</div>'
          : s.paymentUpcomingItems.map(item => paymentUpcomingRow(item)).join('')
        }
      </div>

    </div>

    <!-- ④ 最近需要處理 -->
    <div class="section-title">最近需要處理</div>
    <div class="card">
      <div class="card-title">進行中案件 <a href="quote-admin.html">查看全部 →</a></div>
      ${action5.length === 0
        ? '<div class="empty-row">🎉 目前沒有待處理的案件</div>'
        : action5.map(q => quoteRowHtml(q)).join('')
      }
    </div>

    <!-- ⑤ 整體概覽 -->
    <div class="section-title">整體概覽</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">總案件數</div>
        <div class="stat-value">${s.total}</div>
        <div class="stat-sub">歷史所有案件</div>
      </div>
      <div class="stat-card stat-accent">
        <div class="stat-label">新案件</div>
        <div class="stat-value">${s.newCount}</div>
        <div class="stat-sub">status = new</div>
      </div>
      <div class="stat-card stat-amber">
        <div class="stat-label">開發中</div>
        <div class="stat-value">${s.developing}</div>
        <div class="stat-sub">status = developing</div>
      </div>
      <div class="stat-card stat-green">
        <div class="stat-label">已完成</div>
        <div class="stat-value">${s.done}</div>
        <div class="stat-sub">status = done</div>
      </div>
    </div>

    <!-- ⑥ 動態 -->
    <div class="section-title">動態</div>
    <div class="two-col">

      <div class="card">
        <div class="card-title">最近案件 <a href="quote-admin.html">查看全部 →</a></div>
        ${recent10.length === 0
          ? '<div class="empty-row">尚無案件</div>'
          : recent10.map(q => quoteRowHtml(q)).join('')
        }
      </div>

      <div class="card">
        <div class="card-title">最新活動紀錄</div>
        ${tl.length === 0
          ? '<div class="empty-row">尚無活動紀錄</div>'
          : tl.map((log, idx) => `
            <div class="tl-entry">
              <div class="tl-dot-col">
                <div class="tl-dot type-${log.type}"></div>
                ${idx < tl.length - 1 ? '<div class="tl-line"></div>' : ''}
              </div>
              <div class="tl-body">
                <div class="tl-meta">
                  <span class="tl-type-tag type-${log.type}">${ACTIVITY_TYPE_LABELS[log.type] || log.type}</span>
                  <a class="tl-qid" href="quote-detail.html?id=${encodeURIComponent(log.docId)}">${escapeHtml(log.quoteId)}</a>
                  <span class="tl-time">${fmtDatetime(log.createdAt)}</span>
                </div>
                <div class="tl-content">${escapeHtml(log.content || '')}</div>
              </div>
            </div>`).join('')
        }
      </div>

    </div>
  </div>`;
}

// ══════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════
guardAdmin(loadDashboard);
</script>
</body>
</html>
