<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════
const QSTATUS_LABELS = { draft:'草稿', sent:'已送出', accepted:'已接受', rejected:'已拒絕' };
const QSTATUS_ORDER  = ['draft','sent','accepted','rejected'];

const PAYMENT_TERMS_PRESETS = ['50% 訂金，50% 尾款', '一次付清', '分期付款', '自訂'];

let currentId = null;
let currentData = null;
let items = [];      // quotationItems 工作副本
let dirty = false;
// Requirement Review v1：目前這份明細是依哪一個需求確認版本產生的（null＝不是由確認需求產生）
let itemsFromRevision = null;
let regeneratedThisSession = false;

// ══════════════════════════════════════════════════
//  GET ?id= FROM URL
// ══════════════════════════════════════════════════
function getIdFromUrl() {
  return new URLSearchParams(window.location.search).get('id');
}

// ══════════════════════════════════════════════════
//  LOAD
// ══════════════════════════════════════════════════
async function loadQuote() {
  currentId = getIdFromUrl();
  const wrap = document.getElementById('wrap');

  if (!currentId) {
    wrap.innerHTML = '<div class="error-state">⚠ 網址缺少案件 id 參數（例如 ?id=Q-20260701-123）</div>';
    return;
  }
  document.getElementById('backLink') && (document.getElementById('backLink').href = `quote-detail.html?id=${encodeURIComponent(currentId)}`);

  try {
    const docSnap = await db.collection('quotes').doc(currentId).get();
    if (!docSnap.exists) {
      wrap.innerHTML = `<div class="error-state">⚠ 找不到案件：${escapeHtml(currentId)}</div>`;
      return;
    }
    currentData = docSnap.data();

    // Security v1：客戶的接受／拒絕只寫在 publicQuotations，這裡先對帳同步回內部案件，
    // 確保「客戶已接受」的報價在進入編輯畫面前就會被鎖定。
    await NicocoQuotation.reconcile(db, currentId, currentData);

    // 已有 quotationItems 就沿用（需求確認／重新確認都不會自動覆寫既有報價）。
    // 沒有的話：有已確認的正式需求 → 依確認需求產生明細；否則沿用舊的預設帶入方式。
    itemsFromRevision = currentData.quotationRequirementRevision || null;
    if (currentData.quotationItems && currentData.quotationItems.length > 0) {
      items = currentData.quotationItems.map(i => ({ ...i }));
    } else if (currentData.confirmedRequirements) {
      items = buildItemsFromConfirmed();
      itemsFromRevision = currentData.confirmedRequirements.revision;
    } else {
      items = buildDefaultItems(currentData);
    }

    renderPage();
  } catch (err) {
    console.error(err);
    wrap.innerHTML = `<div class="error-state">⚠ 讀取失敗：${escapeHtml(err.message || String(err))}</div>`;
  }
}

// ══════════════════════════════════════════════════
//  預設帶入：基礎建置費 + 加選功能（單價待手動輸入）
// ══════════════════════════════════════════════════
function genItemId() { return 'qi_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7); }

// ── Requirement Review v1：confirmedRequirements → 正式報價明細（初始化參考，Admin 可自由修改）──
function buildItemsFromConfirmed() {
  return NicocoReview.quotationItemsFromConfirmed(currentData.confirmedRequirements, {
    projectName: NicocoQuotation.projectDisplayName(currentData),
    warrantyLabel: currentData.warrantyLabel || '',
  });
}
function pendingPricingCount() { return NicocoReview.countPendingPricing(items); }

// 已有報價明細時，只有 Admin 主動按下並二次確認才會用確認需求重建；已接受的報價不可重建
function regenerateFromConfirmed() {
  if (!currentData.confirmedRequirements) return;
  if (isQuotationAccepted()) { showToast('正式報價已由客戶接受，無法重新產生'); return; }
  if (!confirm('此操作將取代目前尚未接受的報價明細，是否繼續？')) return;
  items = buildItemsFromConfirmed();
  itemsFromRevision = currentData.confirmedRequirements.revision;
  regeneratedThisSession = true;
  renderItemsTable();
  recalcTotals();
  renderRequirementBanner();
  markDirty();
  showToast('✓ 已依確認需求重新產生報價草稿，確認金額後請按「儲存正式報價」');
}

function renderRequirementBanner() {
  const el = document.getElementById('requirementBanner');
  if (!el) return;
  const c = currentData && currentData.confirmedRequirements;
  if (!c) { el.innerHTML = ''; return; }
  const s = c.summary || {};
  const pending = pendingPricingCount();
  const hasSaved = (currentData.quotationItems || []).length > 0;
  const stale = itemsFromRevision && itemsFromRevision !== c.revision;
  const wantRegen = new URLSearchParams(window.location.search).get('regen') === '1';
  el.innerHTML = `
    <div style="background:var(--accent-light);border:1px solid #bfdbfe;color:#1e40af;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.7;margin-bottom:16px">
      <strong>${itemsFromRevision ? `本正式報價依據 Requirement Review Revision ${escapeHtml(itemsFromRevision)}` : `此案件的需求已確認（Revision ${escapeHtml(c.revision)}），目前的報價明細不是由確認需求產生`}</strong>
      <div style="font-size:12px">確認需求 ${Number(s.includedCount) || 0} 項・排除 ${Number(s.excludedCount) || 0} 項・待人工估價 ${Number(s.manualPricingCount) || 0} 項</div>
      ${stale ? `<div style="font-size:12px;color:#92400e">目前有效的需求確認版本是 Revision ${escapeHtml(c.revision)}，與這份報價依據的版本不同。</div>` : ''}
      ${pending ? `<div style="font-size:12px;color:#92400e;font-weight:600">尚有 ${pending} 項正式需求未完成定價（標示「待填價格」）。全部填寫後才能將報價設為「已送出」。</div>` : ''}
      ${hasSaved && !isQuotationAccepted() ? `
        <div style="margin-top:6px;font-size:12px">本案件已有正式報價明細。需求確認不會自動覆寫現有報價。</div>
        <button type="button" onclick="regenerateFromConfirmed()" style="font:inherit;font-size:12.5px;margin-top:6px;padding:6px 14px;border-radius:8px;cursor:pointer;border:1.5px solid ${wantRegen ? '#1e40af' : '#bfdbfe'};background:#fff;color:#1e40af">依確認需求重新產生報價草稿</button>` : ''}
    </div>`;
}

function buildDefaultItems(q) {
  const out = [];

  // ① 基礎建置費 — 用系統估算的中位數金額帶入，若無（客製評估）則留 0
  const basePrice = (q.priceMid !== null && q.priceMid !== undefined) ? Number(q.priceMid) : 0;
  out.push({
    id: genItemId(),
    name: '基礎建置費',
    // 這段說明會出現在客戶的正式報價單上：需求書案件使用中性名稱，不顯示底層方案類型
    description: `${NicocoQuotation.projectDisplayName(q)}　含 RWD・基礎 SEO・SSL・部署・DNS`,
    qty: 1,
    unitPrice: basePrice,
    subtotal: basePrice,
  });

  // ② 加選功能 — selectedItems 是純名稱字串陣列，沒有單價資料，預設 0 元讓使用者手動填
  (q.selectedItems || []).forEach(name => {
    out.push({
      id: genItemId(),
      name: name,
      description: '',
      qty: 1,
      unitPrice: 0,
      subtotal: 0,
    });
  });

  // ③ 需評估項目 — 同樣先列出但金額 0，需求第 4 點要求「可先不計價，手動輸入」
  (q.evaluationItems || []).forEach(name => {
    out.push({
      id: genItemId(),
      name: `${name}（需評估）`,
      description: '依現場訪談結果調整費用',
      qty: 1,
      unitPrice: 0,
      subtotal: 0,
    });
  });

  return out;
}

function fmtDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit' });
}
function fmtMoney(n) { return `NT$${Number(n||0).toLocaleString()}`; }

function fmtPriceRange(q) {
  if (q.priceMid === null || q.priceMid === undefined) return '需評估';
  return `${fmtMoney(q.priceMid)}（${q.priceRange || '—'}）`;
}

function isQuotationAccepted() {
  return !!(currentData && currentData.quotationStatus === 'accepted');
}
function applyAcceptedLock() {
  if (!isQuotationAccepted()) return;
  const wrap = document.getElementById('wrap');
  wrap.querySelectorAll('.card input, .card textarea, .card select, .qi-add-btn, .qi-delete-btn')
    .forEach(el => { el.disabled = true; });
  const saveBtn = document.getElementById('saveBtn');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.style.opacity = '.4'; saveBtn.style.cursor = 'not-allowed'; }
  if (!document.getElementById('acceptedLockNotice')) {
    const n = document.createElement('div');
    n.id = 'acceptedLockNotice';
    n.style.cssText = 'background:var(--green-light);border:1px solid #bbf7d0;color:#166534;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:16px';
    n.textContent = '此報價已由客戶接受。如需修改需求或金額，請建立新的報價版本／Change Request。';
    const firstCard = wrap.querySelector('.card');
    if (firstCard) wrap.insertBefore(n, firstCard);
  }
}

function renderItemsTable() {
  const tbody = document.getElementById('qiTableBody');
  tbody.innerHTML = items.map(item => `
    <tr data-id="${item.id}">
      <td><input class="qi-input" value="${escapeHtml(item.name)}" oninput="updateItem('${item.id}','name',this.value)"></td>
      <td><textarea class="qi-textarea" rows="1" oninput="updateItem('${item.id}','description',this.value)">${escapeHtml(item.description||'')}</textarea></td>
      <td><input class="qi-input num" type="number" min="0" step="1" value="${item.qty}" oninput="updateItem('${item.id}','qty',this.value)"></td>
      <td><input class="qi-input num" type="number" min="0" step="100" value="${item.pricingPending ? '' : item.unitPrice}"
                 ${item.pricingPending ? 'placeholder="待填價格" style="border-color:var(--amber);background:var(--amber-light)"' : ''}
                 oninput="updateItem('${item.id}','unitPrice',this.value)"></td>
      <td class="qi-subtotal">${item.pricingPending ? '<span style="color:var(--amber);font-weight:600">待填價格</span>' : fmtMoney(item.subtotal)}</td>
      <td><button class="qi-delete-btn" onclick="deleteItem('${item.id}')" title="刪除項目">✕</button></td>
    </tr>`).join('');
}

function updateItem(id, field, value) {
  const item = items.find(i => i.id === id);
  if (!item) return;

  if (field === 'qty' || field === 'unitPrice') {
    // 待填價格的項目：填入數字才算完成定價；清空則回到待填狀態（不會用 0 假裝已定價）
    if (field === 'unitPrice' && 'pricingPending' in item) {
      const wasPending = item.pricingPending;
      item.pricingPending = String(value).trim() === '';
      item.unitPrice = item.pricingPending ? null : (Number(value) || 0);
      if (wasPending !== item.pricingPending) {
        const inp = document.querySelector(`tr[data-id="${id}"] input[step="100"]`);
        if (inp) { inp.style.borderColor = item.pricingPending ? 'var(--amber)' : ''; inp.style.background = item.pricingPending ? 'var(--amber-light)' : ''; }
        renderRequirementBanner();
      }
    } else {
      item[field] = Number(value) || 0;
    }
    item.subtotal = (Number(item.qty) || 0) * (Number(item.unitPrice) || 0);
    if (item.pricingPending) {
      const cell = document.querySelector(`tr[data-id="${id}"] .qi-subtotal`);
      if (cell) cell.innerHTML = '<span style="color:var(--amber);font-weight:600">待填價格</span>';
      recalcTotals(); markDirty(); return;
    }
    // 只更新該列小計顯示，不整表重繪（避免輸入時 focus 跳掉）
    const row = document.querySelector(`tr[data-id="${id}"] .qi-subtotal`);
    if (row) row.textContent = fmtMoney(item.subtotal);
  } else {
    item[field] = value;
  }
  recalcTotals();
  markDirty();
}

function addItem() {
  items.push({ id: genItemId(), name: '', description: '', qty: 1, unitPrice: 0, subtotal: 0 });
  renderItemsTable();
  recalcTotals();
  markDirty();
}

function deleteItem(id) {
  items = items.filter(i => i.id !== id);
  renderItemsTable();
  recalcTotals();
  markDirty();
}

// ══════════════════════════════════════════════════
//  TOTALS
// ══════════════════════════════════════════════════
function recalcTotals() {
  const subtotal = items.reduce((sum, i) => sum + (Number(i.subtotal) || 0), 0);
  const discount = Number(document.getElementById('f-discount')?.value || 0);
  const tax      = Number(document.getElementById('f-tax')?.value || 0);
  const total    = subtotal - discount + tax;

  const subtotalEl = document.getElementById('sumSubtotal');
  const totalEl    = document.getElementById('sumTotal');
  if (subtotalEl) subtotalEl.textContent = fmtMoney(subtotal);
  if (totalEl)    totalEl.textContent    = fmtMoney(total);
}

//  HELPERS
// ══════════════════════════════════════════════════
function tsToDateInput(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

function markDirty() { dirty = true; }

// ══════════════════════════════════════════════════
//  TOKEN
// ══════════════════════════════════════════════════
function generateClientToken() {
  // 32 字元隨機 hex（128-bit entropy）
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr, b => b.toString(16).padStart(2, '0')).join('');
}

// ══════════════════════════════════════════════════
//  COPY QUOTATION LINK
// ══════════════════════════════════════════════════
function copyQuotationLink() {
  // Security v1：連結只帶 clientToken（publicQuotations 的文件 ID）。舊版 token 一律視為失效。
  if (!NicocoQuotation.hasSecureLink(currentData)) {
    showToast(currentData && currentData.clientToken
      ? '⚠ 舊的客戶連結已失效，請重新儲存一次正式報價以產生新的安全連結'
      : '⚠ 請先儲存正式報價，才能複製客戶連結');
    return;
  }
  const url = NicocoQuotation.publicUrl(currentData.clientToken);
  const hint = currentData.quotationStatus === 'draft'
    ? '（目前為草稿：客戶可預覽但無法回覆，狀態改為「已送出」並儲存後才能接受／拒絕）' : '';
  navigator.clipboard.writeText(url).then(() => {
    showToast('✓ 客戶連結已複製到剪貼簿' + hint);
  }).catch(() => {
    prompt('請手動複製此連結：', url);
  });
}

// ══════════════════════════════════════════════════
//  SAVE
// ══════════════════════════════════════════════════
function genActivityId() { return 'act_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }

async function saveQuotation() {
  if (!currentId) return;
  if (isQuotationAccepted()) {
    showToast('此報價已由客戶接受，無法直接修改。如需調整請建立新的報價版本／Change Request。');
    return;
  }
  const btn = document.getElementById('saveBtn');
  const statusEl = document.getElementById('saveStatus');

  btn.disabled = true;
  statusEl.textContent = '儲存中…';
  statusEl.className = 'save-status saving';

  const subtotal = items.reduce((sum, i) => sum + (Number(i.subtotal) || 0), 0);
  const discount = Number(document.getElementById('f-discount').value || 0);
  const tax      = Number(document.getElementById('f-tax').value || 0);
  const total    = subtotal - discount + tax;

  const validUntilRaw = document.getElementById('f-validUntil').value;
  const paymentTermsSel    = document.getElementById('f-paymentTerms').value;
  const paymentTermsCustom = document.getElementById('f-paymentTermsCustom').value.trim();
  const paymentTerms = (paymentTermsSel === '自訂' && paymentTermsCustom) ? paymentTermsCustom : paymentTermsSel;

  // 清理 items：subtotal 一律重算一次，避免任何不同步
  const cleanItems = items.map(i => {
    const out = {
      id: i.id,
      name: i.name,
      description: i.description || '',
      qty: Number(i.qty) || 0,
      unitPrice: i.pricingPending ? null : (Number(i.unitPrice) || 0),
      subtotal: i.pricingPending ? 0 : (Number(i.qty) || 0) * (Number(i.unitPrice) || 0),
    };
    // Requirement Review v1 的選填欄位：舊報價明細不會有，也不需要補
    if (i.pricingPending) out.pricingPending = true;
    if (i.reqKey) out.reqKey = i.reqKey;
    return out;
  });

  // ── Token（Security v1）──
  // 已有 Security v1 公開報價的案件：沿用同一個 token，客戶手上的連結不會失效。
  // 沒有 token，或只有舊版 token（曾可被任意讀取）：產生新的 128-bit token。
  const hasSecure   = NicocoQuotation.hasSecureLink(currentData);
  const clientToken = hasSecure ? currentData.clientToken : NicocoQuotation.generateClientToken();
  const version     = (Number(currentData && currentData.publicQuotationVersion) || 0) + 1;

  const newStatus = document.getElementById('f-quotationStatus').value;

  // 還有待填價格的項目時，不能送出或標記接受：客戶不應該收到含 NT$0 的待評估功能
  const pendingCount = cleanItems.filter(i => i.pricingPending).length;
  if (pendingCount > 0 && (newStatus === 'sent' || newStatus === 'accepted')) {
    showToast(`⚠ 尚有 ${pendingCount} 項正式需求未完成定價，請填寫價格後再將報價設為「${QSTATUS_LABELS[newStatus]}」`);
    btn.disabled = false;
    statusEl.textContent = '';
    return;
  }

  const quotation = {
    quotationItems:     cleanItems,
    quotationSubtotal:  subtotal,
    quotationDiscount:  discount,
    quotationTax:       tax,
    quotationTotal:     total,
    quotationStatus:    newStatus,
    paymentTerms:       paymentTerms,
    validUntil:         validUntilRaw ? firebase.firestore.Timestamp.fromDate(new Date(validUntilRaw)) : null,
    quotationNote:      document.getElementById('f-quotationNote').value,
  };

  // Admin 直接把狀態存成「已接受」＝代客戶標記接受：會建立不可變的接受紀錄並鎖定報價
  if (newStatus === 'accepted'
      && !confirm('確定要將此報價標記為「已接受」嗎？\n系統會建立一份不可修改的接受紀錄，之後此報價內容與金額將無法再編輯。')) {
    btn.disabled = false;
    statusEl.textContent = '';
    return;
  }

  const ts = firebase.firestore.FieldValue.serverTimestamp();
  const payload = {
    ...quotation,
    quotationUpdatedAt: ts,
    clientToken:        clientToken,
    publicQuotationVersion: version,
  };
  if (itemsFromRevision) payload.quotationRequirementRevision = itemsFromRevision;

  // 同時在 activityLogs 新增一筆紀錄
  const newLog = {
    id:        genActivityId(),
    type:      'quote',
    content:   `已建立 / 更新正式報價，總金額 ${fmtMoney(total)}`,
    createdAt: firebase.firestore.Timestamp.now(),
    createdBy: 'me',
  };

  try {
    // 工作室顯示資料：投影到公開報價（settings/studio 只有 Admin 可讀，報價頁不再直接讀取）
    let studio = {};
    try {
      const studioSnap = await db.collection('settings').doc('studio').get();
      studio = studioSnap.exists ? studioSnap.data() : {};
    } catch (e) { console.error('讀取 settings/studio 失敗：', e); }

    const pub = NicocoQuotation.buildPublicProjection(currentId, currentData, quotation, studio, version, ts);

    // 單一 batch：內部案件 + 公開投影（+ Admin 代標接受時的 acceptance 快照）一起成功或一起失敗
    const quoteRef = db.collection('quotes').doc(currentId);
    const batch = db.batch();
    const logs = [newLog];
    if (regeneratedThisSession) {
      logs.push({
        id: genActivityId(), type: 'quote',
        content: `已依確認需求（Revision ${itemsFromRevision}）重新產生正式報價明細`,
        createdAt: firebase.firestore.Timestamp.now(), createdBy: 'me',
      });
    }
    batch.update(quoteRef, {
      ...payload,
      activityLogs: firebase.firestore.FieldValue.arrayUnion(...logs),
    });
    batch.set(db.collection('publicQuotations').doc(clientToken), pub);
    if (newStatus === 'accepted') {
      batch.set(quoteRef.collection('acceptances').doc(clientToken),
                NicocoQuotation.buildAcceptance(clientToken, pub, 'admin', ts));
    }
    await batch.commit();

    // 同步本地 currentData（讓 copyQuotationLink 與鎖定判斷立即生效）
    if (currentData) {
      currentData.clientToken = clientToken;
      currentData.publicQuotationVersion = version;
      currentData.quotationStatus = newStatus;
      currentData.quotationItems = cleanItems;
      if (itemsFromRevision) currentData.quotationRequirementRevision = itemsFromRevision;
    }
    regeneratedThisSession = false;
    renderRequirementBanner();
    applyAcceptedLock();

    dirty = false;
    statusEl.textContent = '✓ 已儲存';
    statusEl.className = 'save-status saved';

    // 同步畫面上的狀態 badge
    const badge = document.getElementById('qStatusBadge');
    if (badge) {
      badge.className = `status-badge qstatus-${payload.quotationStatus}`;
      badge.textContent = QSTATUS_LABELS[payload.quotationStatus];
    }

    setTimeout(() => { if (!dirty) statusEl.textContent = ''; }, 2500);
  } catch (err) {
    console.error(err);
    statusEl.textContent = '⚠ 儲存失敗';
    statusEl.className = 'save-status error';
    showToast(`⚠ 儲存失敗：${err.message || err}`);
  } finally {
    btn.disabled = isQuotationAccepted();   // 已接受的報價維持鎖定
  }
}

window.addEventListener('beforeunload', (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

// ══════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════
// ══════════════════════════════════════════════════
//  AUTH GUARD
// ══════════════════════════════════════════════════
function guardAdmin(onPass) {
  auth.onAuthStateChanged(user => {
    if (!user) {
      window.location.replace(`admin-login.html?next=${encodeURIComponent(window.location.href)}`);
      return;
    }
    if (!ALLOWED_EMAILS.includes(user.email)) {
      auth.signOut();
      window.location.replace('admin-login.html');
      return;
    }
    const emailEl = document.getElementById('headerEmail');
    if (emailEl) emailEl.textContent = user.email;
    onPass();
  });
}
async function signOut() {
  await auth.signOut();
  window.location.replace('admin-login.html');
}

guardAdmin(loadQuote);
</script>
